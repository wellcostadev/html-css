<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>
    <style>
        h1{
            background-color: lightcyan;
            height: 300px;
            width: 300px;
            /*border-width: 10px;
            border-style: solid;
            border-color: darkslategray;*/
            padding: 10px;
            border: 10px solid darkslategray;

            margin: 20px auto 20px;
            
            /*outline-width: 5px;
            outline-style: dashed;
            outline-color: lightgreen;*/
            outline: 5px dashed lightgreen;
        }
        
        p{
            margin-top: 30px;
        }
        a{
            /*border-width: 10px;
            border-style: solid;
            border-color: red;*/
            padding: 10px;
            border: 10px solid red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragráfos são exemplos de box level, mas os <a href="#">Links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p> 
</body>
</html>
