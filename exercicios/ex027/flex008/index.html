<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: antiquewhite;
            height: 300px;
            display: flex;
            flex-flow: wrap; 
            align-items: center;
        }

        div.item{
            background-color: lightcoral;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#i1{
            align-self: auto;
        }

        div#i2{
            align-self: flex-start;
        }

        div#i3{
            align-self: flex-end;
        }

        div#i4{
            align-self: center;
        }

        div#i5{
            align-self: auto;
        }

        div#i6{
            align-self: flex-end;
        }

        div#i7{
           align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id = "i1">A</div>
        <div class="item" id = "i2">B</div>
        <div class="item" id = "i3">C</div>
        <div class="item" id = "i4">D</div>
        <div class="item" id = "i5">E</div>
        <div class="item" id = "i6">F</div>
        <div class="item" id = "i7">G</div>
    </div>
</body>
</html>
