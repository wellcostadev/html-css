<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Esse vídeo está hospedado no meu próprio servidor</p>
    <!--FORMA SIMPLES-->
    <video src="midia/meu-video.mp4" width="500px" controls></video>

    <!--FORMA MAIS SEGURA-->
    <video width="500px" poster="imagens/foto-p.png" controls>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.mp4" type="video/ogv">
    </video>

    <h1>Videos Incorporados</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/I29yEC9QwMs?si=Y48xzs__9uHjWFVx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/5oeEv5MtP_Y?si=UZnGoNe4LyPXG3xb" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
