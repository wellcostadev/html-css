<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        div{
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <div>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">

                <!--<option value="" selected>-- Escolha --</option>-->
                <option value="" disabled selected> -- Escolha --</option>
                <optgroup label="Região Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernanbuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>

            </select>
        </div>
        
        <div>
            <label for="iprof">Profissão</label>
            <input type="text" name="prof" id="iprof" list="ilist">
            <datalist id="ilist">
                <option value="">Administrador</option>
                <option value="">Contador</option>
                <option value="">Desenvolvedor</option>
                <option value="">Professor</option>
            </datalist>
        </div>

        <p>
            <label for="imsg">Mensagem:</label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="6" placeholder="Escreva aqui" maxlength="50"></textarea> <br>
            <output id="iletras">Caracteres: 50</output> 
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <!--SCRIPT ABAIXO FEITO PELO GEMINI-->
    <script>
        const textarea = document.getElementById('imsg');
        const output = document.getElementById('iletras');
        const form = document.getElementById('meuFormulario');
        const maxCaracteres = textarea.maxLength;

        // Atualiza a contagem a cada caractere digitado ou apagado
        textarea.addEventListener('input', () => {
            const restantes = maxCaracteres - textarea.value.length;
            output.textContent = `Caracteres restantes: ${restantes}`;
        });

        // Reseta o contador para 50 quando o botão "Limpar" for clicado
        form.addEventListener('reset', () => {
            output.textContent = `Caracteres restantes: ${maxCaracteres}`;
        });
    </script>
</body>
</html>
